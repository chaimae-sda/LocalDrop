name: Vérifier et compiler LocalDrop

on:
  push:
    branches:
      - feat/chaimae-auth-profil-flutter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Conserver l’application Web compilée
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-web
          path: build/web/
          if-no-files-found: error
