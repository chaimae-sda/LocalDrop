name: Vérifier et compiler LocalDrop

on:
  push:
    branches:
      - feat/chaimae-auth-profil-flutter
      - feat/chaimae-auth-profil-flutter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Conserver l’application Web compilée
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-web
          path: build/web/
          if-no-files-found: error

  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: apk
            options: --debug
            output: build/app/outputs/flutter-apk/app-debug.apk
          - runner: macos-15
            target: ios
            options: --simulator --debug
            output: build/ios/iphonesimulator/Runner.app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '17'
      - run: dart tool/prepare_mobile.dart
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} ${{ matrix.options }}
      - uses: actions/upload-artifact@v4
        with:
          name: localdrop-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error
